[tool.poetry]
name = "algobotdash"
version = "0.1.0"
description = "Dashboard local para análise reproduzível de trades do MetaTrader 5"
authors = ["Paulo Henrique Barreto Reboucas"]
readme = "README.md"
packages = [{ include = "algobotdash" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
openpyxl = ">=3.1,<4.0"
pyyaml = ">=6.0,<7.0"
fastapi = ">=0.141,<0.142"
starlette = ">=1.1.0,<2.0.0"
uvicorn = ">=0.30,<1.0"
pylint = "^4.0.8"

[tool.poetry.group.dev.dependencies]
httpx = ">=0.27,<0.28"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.basedpyright]
reportMissingModuleSource = "warning"
venvPath = "."
venv = ".venv"
