[tool.poetry]
name = "algobotdash"
version = "0.1.0"
description = "Dashboard local para análise reproduzível de trades do MetaTrader 5"
authors = ["Paulo Henrique Barreto Reboucas"]
readme = "README.md"
packages = [{ include = "algobotdash" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
openpyxl = ">=3.1,<4.0"
pyyaml = ">=6.0,<7.0"

[tool.poetry.group.dev.dependencies]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.basedpyright]
reportMissingModuleSource = "warning"
