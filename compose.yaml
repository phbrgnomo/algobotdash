services:
  algobotdash:
    build: .
    command: ["uvicorn", "algobotdash.web:app", "--host", "0.0.0.0", "--port", "8765"]
    environment:
      ALGOBOTDASH_CONFIG: "${ALGOBOTDASH_CONFIG:-/app/config/config.yaml}"
      ALGOBOTDASH_DATABASE: "${ALGOBOTDASH_DATABASE:-/app/data/algobotdash.sqlite}"
    user: "${ALGOBOTDASH_UID:-10001}:${ALGOBOTDASH_GID:-10001}"
    ports:
      - "127.0.0.1:${ALGOBOTDASH_PORT:-8765}:8765"
    volumes:
      - ./config:/app/config:ro
      - ./source:/app/source:ro
      - ./data:/app/data
      - ./reports:/app/reports
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
